<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File expired · {{ app_name }}</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #111111; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 1.75rem; max-width: 380px; text-align: center; }
    h1 { font-size: 1.2rem; margin: 0 0 .5rem; }
    p { color: #a3a3a8; margin: 0 0 1.25rem; font-size: .95rem; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.25rem; border-radius: 10px; background: #4361ee; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
{% include "_icons.html" %}
</head>
<body>
  <div class="card">
    <img src="/static/brand/voicecom-icon.svg" alt="{{ app_name }}" width="56" height="56" style="margin-bottom:.75rem">
    <h1>This file has expired</h1>
    <p>Files shared in chat are kept for 4 hours, then removed. Ask the person who shared it to send it again.</p>
    <a href="/">Back to {{ app_name }}</a>
  </div>
</body>
</html>
